name: Lightweight reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned research dependencies
        run: |
          python -m pip install -r environment/requirements_final_portable_20261025.txt
          python -m pip install --no-deps -e .
      - name: Verify official source bytes and repository evidence
        run: |
          python scripts/verify_data_sources.py
          python scripts/audit_repository.py
      - name: Rebuild saved tables and run scientific toy tests
        run: |
          python scripts/reproduce_repository.py --tables
          python -m pytest -q
