[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-federated-statistical-synthesis"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "Non-neural statistical aggregation benchmark for UCI Adult"

[tool.setuptools.packages.find]
include = ["btp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
